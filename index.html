<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study Buddy</title>
    <meta name="description" content="Web page for the Bible Study Buddy webapp">
    <meta name="author" content="Jacob Nielsen">
    <link rel="icon" href="images/favicon.ico">
    <meta property="og:title" content="App">
    <meta property="og:site_name" content="Bible Study Buddy">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Web page for the Bible Study Buddy webapp">
    <meta property="og:image" content="https://jcbcnielsen.github.io/wdd330/images/open-graph.webp">
    <meta property="og:url" content="https://jcbcnielsen.github.io/wdd330/index.html">
    <link rel="stylesheet" href="styles/normalize.css">
    <link id="colorModeLink" rel="stylesheet" href="styles/lightmode.css">
    <link rel="stylesheet" href="styles/main-small.css">
    <link rel="stylesheet" href="styles/main-large.css">
    <script src="scripts/main.js" type="module"></script>
</head>

<body>
    <header>
        <img src="images/logo.webp" alt="Bible Study Buddy Logo">
        <h2>Bible Study Buddy</h2>
        <div id="headerMenu">
            <button id="verseDayButton">Verse of the Day</button>
            <button id="colorModeButton"></button>
        </div>
        <button id="menuButton"></button>
        <dialog id="verseDayDialog"></dialog>
    </header>

    <main>
        <div id="firstChapterColumn" class="chapterColumn">
            <select id="firstColumnTranslationSelect"></select>
            <button id="columnShowButton"></button>
            <select id="firstColumnBookSelect"></select>
            <select id="firstColumnChapterSelect"></select>
            <button id="firstColumnReadButton"></button>
            <div class="chapterContent">
                <ol id="firstColumnContent"></ol>
            </div>
        </div>

        <div id="secondChapterColumn" class="chapterColumn">
            <select id="secondColumnTranslationSelect"></select>
            <button id="columnHideButton"></button>
            <select id="secondColumnBookSelect"></select>
            <select id="secondColumnChapterSelect"></select>
            <button id="secondColumnReadButton"></button>
            <div class="chapterContent">
                <ol id="secondColumnContent"></ol>
            </div>
        </div>

        <div id="dictionaryColumn"></div>
    </main>

    <footer>

    </footer>
</body>

</html>
